#cloud-config
package_update: false
package_upgrade: false

# DNS fallback for VPN environments
manage_resolv_conf: true
resolv_conf:
  nameservers:
    - 8.8.8.8
    - 1.1.1.1
  searchdomains: []
  options:
    timeout: 2
    attempts: 3

runcmd:
  - apt-get update -qq
  - apt-get install -y -qq haproxy
  - |
    cat >> /etc/haproxy/haproxy.cfg << 'EOF'

    frontend k8s-api
        bind *:6443
        mode tcp
        option tcplog
        default_backend k8s-masters

    backend k8s-masters
        mode tcp
        balance roundrobin
        option tcp-check
        server master-1 10.0.0.151:6443 check
        server master-2 10.0.0.152:6443 check
        server master-3 10.0.0.153:6443 check

    listen stats
        bind :1936
        mode http
        stats enable
        stats uri /
        stats hide-version
    EOF
  - systemctl restart haproxy
  - systemctl enable haproxy
