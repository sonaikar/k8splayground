#cloud-config
package_update: false
package_upgrade: false

# DNS fallback for VPN environments
manage_resolv_conf: true
resolv_conf:
  nameservers:
    - 8.8.8.8
    - 1.1.1.1
  searchdomains: []
  options:
    timeout: 2
    attempts: 3

write_files:
  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.ipv4.ip_forward = 1
  
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

  - path: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false

  - path: /tmp/install-k8s.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      
      # Load kernel modules
      modprobe overlay
      modprobe br_netfilter
      sysctl --system
      
      # Detect architecture
      ARCH=$(uname -m)
      if [ "$ARCH" = "aarch64" ]; then
        ARCH_SUFFIX="arm64"
        CNI_ARCH="arm"
      else
        ARCH_SUFFIX="amd64"
        CNI_ARCH="amd64"
      fi
      
      # Install containerd
      CONTAINERD_VERSION="2.1.7"
      wget -q https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-${ARCH_SUFFIX}.tar.gz
      tar Cxzf /usr/local containerd-${CONTAINERD_VERSION}-linux-${ARCH_SUFFIX}.tar.gz
      rm containerd-${CONTAINERD_VERSION}-linux-${ARCH_SUFFIX}.tar.gz
      
      # Setup containerd service
      wget -q https://raw.githubusercontent.com/containerd/containerd/main/containerd.service -O /usr/lib/systemd/system/containerd.service
      
      # Configure containerd
      mkdir -p /etc/containerd
      containerd config default > /etc/containerd/config.toml
      sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      
      systemctl daemon-reload
      systemctl enable --now containerd
      
      # Install runc
      RUNC_VERSION="1.3.5"
      wget -q https://github.com/opencontainers/runc/releases/download/v${RUNC_VERSION}/runc.${ARCH_SUFFIX}
      install -m 755 runc.${ARCH_SUFFIX} /usr/local/sbin/runc
      rm runc.${ARCH_SUFFIX}
      
      # Install CNI plugins
      CNI_VERSION="1.9.1"
      mkdir -p /opt/cni/bin
      wget -q https://github.com/containernetworking/plugins/releases/download/v${CNI_VERSION}/cni-plugins-linux-${CNI_ARCH}-v${CNI_VERSION}.tgz
      tar Cxzf /opt/cni/bin cni-plugins-linux-${CNI_ARCH}-v${CNI_VERSION}.tgz
      rm cni-plugins-linux-${CNI_ARCH}-v${CNI_VERSION}.tgz
      
      # Add Kubernetes apt repository
      mkdir -p /etc/apt/keyrings
      curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
      
      # Install Kubernetes components
      apt-get update
      apt-get install -y kubelet kubeadm kubectl
      apt-mark hold kubelet kubeadm kubectl
      
      
      systemctl enable kubelet
      
      echo "Kubernetes node setup complete!"

runcmd:
  - /tmp/install-k8s.sh
