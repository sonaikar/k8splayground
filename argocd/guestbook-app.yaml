apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sonaikar/k8splayground.git
    path: deployments
    targetRevision: HEAD
  destination:
    namespace: webservice
    server: 'kubernetes-admin@kubernetes'

